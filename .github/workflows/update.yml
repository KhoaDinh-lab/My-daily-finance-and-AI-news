name: Auto Fetch News

on:
  schedule:
    # 07:00 giờ Việt Nam, mỗi 2 ngày
    - cron: "0 0 */2 * *"

    # 22:00 giờ Việt Nam, mỗi 2 ngày
    - cron: "0 15 */2 * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-fetch-news
  cancel-in-progress: false

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m py_compile fetch_news.py

      - name: Run news crawler
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python fetch_news.py

      - name: Commit updated news data
        run: |
          git add data.json

          if git diff --cached --quiet; then
            echo "data.json không thay đổi; không cần commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Auto update daily news [skip ci]"
          git push
