name: Auto Fetch News

on:
  schedule:
    # Chạy tự động lúc 7:00 AM giờ Việt Nam (00:00 UTC) mỗi 2 ngày
    - cron: '0 0 */2 * *'
    # Chạy tự động lúc 10:00 PM giờ Việt Nam (15:00 UTC) mỗi 2 ngày
    - cron: '0 15 */2 * *'
  workflow_dispatch: # Cho phép bạn bấm nút chạy thử thủ công bất kỳ lúc nào

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install google-genai

      - name: Run Gemini News Crawler
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python fetch_news.py

      - name: Commit updated news data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.json
          git commit -m "Auto update daily news [skip ci]" || exit 0
          git push
