name: Auto Fetch News

on:
  schedule:
    # 06:00 giờ Việt Nam mỗi ngày (23:00 UTC ngày hôm trước)
    - cron: "0 23 * * *"

    # 15:00 giờ Việt Nam mỗi ngày
    - cron: "0 8 * * *"

    # 20:30 giờ Việt Nam mỗi ngày
    - cron: "30 13 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-fetch-news
  cancel-in-progress: false

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m py_compile fetch_news.py

      - name: Run news crawler
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python fetch_news.py

      - name: Cảnh báo nếu dữ liệu quá cũ
        if: always()
        run: |
          python - <<'PY'
          import json, os, sys
          from datetime import datetime, timedelta

          def age_hours(path, key="updated_at"):
              try:
                  with open(path, encoding="utf-8") as f:
                      value = json.load(f).get(key, "")
                  stamp = datetime.strptime(value, "%d/%m/%Y %H:%M")
              except Exception as error:
                  print(f"::warning::Không đọc được {path}: {error}")
                  return None
              return (datetime.utcnow() + timedelta(hours=7) - stamp).total_seconds() / 3600

          for path, limit in (("data.json", 18), ("pool.json", 18)):
              if not os.path.exists(path):
                  print(f"::warning::Thiếu {path}")
                  continue
              hours = age_hours(path)
              if hours is None:
                  continue
              print(f"{path}: cũ {hours:.1f} giờ")
              if hours > limit:
                  print(f"::warning::{path} đã cũ hơn {limit} giờ")

          if os.path.exists("data.json"):
              with open("data.json", encoding="utf-8") as f:
                  stale = json.load(f).get("stale_sections") or []
              if stale:
                  print("::warning::Giữ dữ liệu cũ cho các mục: " + ", ".join(stale))
          PY

      - name: Commit updated news data
        run: |
          git add data.json history.json pool.json

          if git diff --cached --quiet; then
            echo "data.json không thay đổi; không cần commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Auto update daily news [skip ci]"
          git push
